# OSV-Scanner exceptions (security.yml). Only advisories in build/dev tooling that never reaches the
# app bundle and have no fix compatible with the current Expo SDK. Each entry expires: when it does,
# CI fails again and the finding gets re-triaged (docs/agent-rules/13-security.md §10).
# The pnpm audit counterpart lives in pnpm-workspace.yaml (auditConfig.ignoreGhsas).

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-01
reason = "zod 3 (memory exhaustion on oversized input) via @expo/cli; CLI-only, fixed only in zod 4, Expo SDK 58 requires zod 3."

