# Habits (#8): edit a habit → archive it → restore it → delete it permanently. Starts from an
# added habit; the habit's id is random, so its controls are matched by pattern.
# Run locally: pnpm test:e2e   (needs a dev build installed on the simulator/emulator)
appId: com.ruvceski.hive.dev
tags:
  - habits
---
- launchApp:
    clearState: true
- tapOn:
    id: 'home-open-habits'
- tapOn:
    id: 'habits-empty-add'
- tapOn:
    id: 'habits-new-name'
- inputText: 'Read'
- hideKeyboard
- tapOn:
    id: 'habits-new-save'
- assertVisible: 'Read'
# Edit: rename and move to the evening.
- tapOn:
    id: 'habits-edit-toggle'
- tapOn:
    id: 'habits-item-edit-.*'
- tapOn:
    id: 'habits-edit-name'
- inputText: ' 10 pages'
- hideKeyboard
- tapOn:
    id: 'habits-edit-time-evening'
- tapOn:
    id: 'habits-edit-save'
- assertVisible:
    id: 'habits-section-evening'
- assertVisible: 'Read 10 pages'
# Archive (confirm), then it is gone from the list.
- tapOn:
    id: 'habits-item-edit-.*'
- tapOn:
    id: 'habits-edit-archive'
- tapOn: 'Archive'
- assertVisible:
    id: 'habits-empty'
# Restore from Archived habits.
- tapOn:
    id: 'habits-archived-link'
- assertVisible: 'Read 10 pages'
- tapOn:
    id: 'habits-archived-restore-.*'
- assertVisible:
    id: 'habits-archived-empty'
- tapOn:
    id: 'habits-archived-back'
- assertVisible: 'Read 10 pages'
# Archive again and delete permanently (the confirm warns about the history).
- tapOn:
    id: 'habits-edit-toggle'
- tapOn:
    id: 'habits-item-edit-.*'
- tapOn:
    id: 'habits-edit-archive'
- tapOn: 'Archive'
- tapOn:
    id: 'habits-archived-link'
- tapOn:
    id: 'habits-archived-delete-.*'
- tapOn: 'Delete'
- assertVisible:
    id: 'habits-archived-empty'
