# Group sheet (#30): open a group from Home, close it, open it again and open Habits from it, then
# Back returns to Home with the sheet gone. Swipe-down to close is the native sheet gesture; it is
# checked by hand on a device (a swipe in Maestro would be timing-dependent).
# Run locally: pnpm test:e2e   (needs a dev build installed on the simulator/emulator)
appId: com.ruvceski.hive.dev
tags:
  - home
---
- launchApp:
    clearState: true
- tapOn:
    id: 'home-group-body-mind'
- assertVisible:
    id: 'group-sheet-title'
    text: 'Body & mind'
- assertVisible:
    id: 'group-sheet-count'
    text: '1 app'
- assertVisible:
    id: 'home-open-habits'
- tapOn:
    id: 'group-sheet-close'
- assertNotVisible:
    id: 'group-sheet'
- assertVisible:
    id: 'home-title'
- runFlow:
    file: subflows/open-from-home.yaml
    env:
      GROUP: body-mind
      APP: habits
- assertVisible:
    id: 'habits-screen'
- tapOn:
    id: 'habits-back'
- assertVisible:
    id: 'home-title'
- assertNotVisible:
    id: 'group-sheet'
