# Wallet receipts: the Receipts tab opens with the scan button in the header and search (scanning needs a camera, so the flow stops there).
appId: com.ruvceski.hive.dev
tags:
  - wallet
---
- launchApp
- tapOn:
    id: 'home-open-wallet'
- tapOn:
    id: 'wallet-tab-receipts'
- assertVisible:
    id: 'wallet-receipt-scan'
- assertVisible:
    id: 'wallet-receipt-search'
- assertVisible:
    id: 'wallet-receipt-photo'
