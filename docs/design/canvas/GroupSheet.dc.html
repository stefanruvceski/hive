<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive home, Creative group opened</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: {{c.text}}; background: {{c.wallpaper}};">
  <div aria-hidden="true" style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 13px; font-weight: 600; color: {{c.text3}};">SATURDAY, OCTOBER 31</span>
    <span style="font-size: 30px; line-height: 36px; font-weight: 700;">Good afternoon</span>
    <span style="display: flex; gap: 12px; margin-top: 54px;">
      <span style="width: 169px; height: 169px; {{c.glass}}"></span>
      <span style="width: 169px; height: 169px; {{c.glass}}"></span>
    </span>
    <span style="display: flex; gap: 12px; margin-top: 34px;">
      <span style="width: 169px; height: 169px; {{c.glass}}"></span>
      <span style="width: 169px; height: 169px; {{c.glass}}"></span>
    </span>
  </div>

  <a href="Main.dc.html" aria-label="Close Creative" style="position: absolute; inset: 0; background: {{c.dim}}; backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%);"></a>

  <section role="dialog" aria-modal="true" aria-labelledby="folder-title" style="position: absolute; inset: 0; box-sizing: border-box; padding: 0 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; pointer-events: none;">
    <h1 id="folder-title" style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; text-align: center;">Creative</h1>

    <div style="pointer-events: auto; width: 100%; box-sizing: border-box; padding: 24px 20px; border-radius: 38px; {{c.panel}} display: grid; grid-template-columns: repeat(4, 65px); justify-content: space-between; row-gap: 18px;">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
        <a href="#" aria-label="Open {{a.name}}" style="width: 65px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: {{c.text}}; text-decoration: none;">
          <span style="width: 65px; height: 65px; box-sizing: border-box; border-radius: 17px; {{a.tile}} display: flex; align-items: center; justify-content: center;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{a.glyph}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"/></svg>
          </span>
          <span style="width: 100%; font-size: 12px; line-height: 15px; font-weight: 500; color: {{c.text2}}; text-align: center; overflow-wrap: anywhere;">{{a.name}}</span>
        </a>
      </sc-for>
    </div>

    <a href="Customize.dc.html" style="pointer-events: auto; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 22px; {{c.control}} color: {{c.accentText}}; font-size: 16px; font-weight: 600; text-decoration: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      Edit group
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2DD4BF","options":["#2DD4BF","#34D399","#4ADE80"]},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#2DD4BF';
    var light = (this.props.theme ?? 'dark') === 'light';
    var c = light ? {
      text: '#0F172A', text2: '#334155', text3: '#475569', accentText: '#0F766E',
      wallpaper: 'radial-gradient(90% 26% at 0% 0%, rgba(45,212,191,0.32) 0%, rgba(45,212,191,0) 100%), radial-gradient(70% 22% at 100% 22%, rgba(251,191,36,0.24) 0%, rgba(251,191,36,0) 100%), radial-gradient(80% 26% at 0% 52%, rgba(45,212,191,0.22) 0%, rgba(45,212,191,0) 100%), radial-gradient(80% 26% at 100% 74%, rgba(139,92,246,0.16) 0%, rgba(139,92,246,0) 100%), radial-gradient(100% 26% at 40% 100%, rgba(45,212,191,0.24) 0%, rgba(45,212,191,0) 100%), #EEF2F5',
      glass: 'border-radius: 30px; background: rgba(255,255,255,0.62); border: 1px solid rgba(15,23,42,0.07);',
      dim: 'rgba(238,242,245,0.45)',
      panel: 'background: rgba(255,255,255,0.62); border: 1px solid rgba(15,23,42,0.07); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 18px 48px rgba(15,23,42,0.16);',
      control: 'border: 1px solid rgba(15,23,42,0.10); background: rgba(255,255,255,0.70); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 18px rgba(15,23,42,0.10);'
    } : {
      text: '#F8FAFC', text2: '#CBD5E1', text3: '#A3AEC2', accentText: accent,
      wallpaper: 'radial-gradient(90% 26% at 0% 0%, rgba(20,110,100,0.75) 0%, rgba(20,110,100,0) 100%), radial-gradient(70% 22% at 100% 22%, rgba(120,84,30,0.55) 0%, rgba(120,84,30,0) 100%), radial-gradient(80% 26% at 0% 52%, rgba(16,120,110,0.55) 0%, rgba(16,120,110,0) 100%), radial-gradient(80% 26% at 100% 74%, rgba(76,60,160,0.45) 0%, rgba(76,60,160,0) 100%), radial-gradient(100% 26% at 40% 100%, rgba(20,110,100,0.60) 0%, rgba(20,110,100,0) 100%), #0A0F1C',
      glass: 'border-radius: 30px; background: rgba(17,26,46,0.52); border: 1px solid rgba(255,255,255,0.09);',
      dim: 'rgba(3,6,14,0.45)',
      panel: 'background: rgba(17,26,46,0.52); border: 1px solid rgba(255,255,255,0.09); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 48px rgba(0,0,0,0.45);',
      control: 'border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 6px 18px rgba(0,0,0,0.35);'
    };
    var tint = light
      ? { books: '#C2410C', drawify: '#6D28D9', music: '#BE185D', placeholder: '#64748B' }
      : { books: '#FDBA74', drawify: '#C4B5FD', music: '#F9A8D4', placeholder: '#8B95A7' };
    var placeholder = 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z';
    // Every app in the group, most used first (the same order as the card).
    var list = [
      { id: 'books', name: 'Books', icon: 'M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z' },
      { id: 'drawify', name: 'Drawify', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
      { id: 'music', name: 'Music', icon: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z' },
      { id: 'placeholder', name: '[App 4]', icon: placeholder },
      { id: 'placeholder', name: '[App 5]', icon: placeholder },
      { id: 'placeholder', name: '[App 6]', icon: placeholder },
      { id: 'placeholder', name: '[App 7]', icon: placeholder }
    ];
    return {
      c: c,
      apps: list.map(function (a) {
        var color = tint[a.id];
        return Object.assign({}, a, {
          glyph: color,
          tile: light
            ? 'background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%); border: 1px solid ' + color + '33; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 10px rgba(15,23,42,0.10);'
            : 'background: linear-gradient(180deg, #1D2A47 0%, #111A2E 100%); border: 1px solid ' + color + '45; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 3px 10px rgba(0,0,0,0.45);'
        });
      })
    };
  }
}
</script>
</body>
</html>
