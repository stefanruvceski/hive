<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive home, Creative group opened</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: {{c.text}}; background: {{c.wallpaper}};">
  <div aria-hidden="true" style="padding: 58px 20px 0; display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 13px; font-weight: 600; color: {{c.text3}};">SATURDAY, OCTOBER 31</span>
    <span style="font-size: 30px; line-height: 36px; font-weight: 700;">Good afternoon</span>
    <span style="display: flex; gap: 12px; margin-top: 54px;">
      <span style="width: 169px; height: 169px; {{c.glass}}"></span>
      <span style="width: 169px; height: 169px; {{c.glass}}"></span>
    </span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.dim}};"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 560px; box-sizing: border-box; padding: 10px 16px 28px; border-radius: 38px; {{c.sheet}} display: flex; flex-direction: column; gap: 16px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.grabber}};"></span>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px;">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <h1 id="sheet-title" style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Creative</h1>
        <span style="font-size: 13px; color: {{c.text4}};">3 apps</span>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; flex-shrink: 0; box-sizing: border-box; border-radius: 20px; {{c.control}} display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div style="border-radius: 26px; background: {{c.inset}}; border: 1px solid {{c.line}}; overflow: hidden;">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 0 14px; color: {{c.text}}; text-decoration: none; border-top: {{a.divider}};">
          <span style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border-radius: 14px; {{a.tile}} display: flex; align-items: center; justify-content: center;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{a.glyph}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"/></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;">
            <span style="font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{a.name}}</span>
            <span style="font-size: 13px; color: {{c.text4}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{a.about}}</span>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.chevron}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
    </div>

    <a href="Customize.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 6px; color: {{c.accentText}}; font-size: 16px; font-weight: 600; text-decoration: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      Edit group
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2DD4BF","options":["#2DD4BF","#34D399","#4ADE80"]},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#2DD4BF';
    var light = (this.props.theme ?? 'dark') === 'light';
    var c = light ? {
      text: '#0F172A', text3: '#475569', text4: '#64748B', chevron: '#94A3B8', accentText: '#0F766E',
      wallpaper: 'radial-gradient(90% 26% at 0% 0%, rgba(45,212,191,0.32) 0%, rgba(45,212,191,0) 100%), radial-gradient(70% 22% at 100% 22%, rgba(251,191,36,0.24) 0%, rgba(251,191,36,0) 100%), radial-gradient(80% 26% at 0% 52%, rgba(45,212,191,0.22) 0%, rgba(45,212,191,0) 100%), radial-gradient(80% 26% at 100% 74%, rgba(139,92,246,0.16) 0%, rgba(139,92,246,0) 100%), radial-gradient(100% 26% at 40% 100%, rgba(45,212,191,0.24) 0%, rgba(45,212,191,0) 100%), #EEF2F5',
      glass: 'border-radius: 30px; background: rgba(255,255,255,0.62); border: 1px solid rgba(15,23,42,0.07);',
      dim: 'rgba(15,23,42,0.28)',
      sheet: 'background: rgba(248,250,252,0.86); border: 1px solid rgba(255,255,255,0.9); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 1px 0 #FFFFFF, 0 -12px 40px rgba(15,23,42,0.18);',
      grabber: 'rgba(15,23,42,0.2)', inset: 'rgba(255,255,255,0.8)', line: 'rgba(15,23,42,0.08)',
      control: 'border: 1px solid rgba(15,23,42,0.10); background: rgba(255,255,255,0.8); color: #1E293B;'
    } : {
      text: '#F8FAFC', text3: '#A3AEC2', text4: '#8B95A7', chevron: '#475569', accentText: accent,
      wallpaper: 'radial-gradient(90% 26% at 0% 0%, rgba(20,110,100,0.75) 0%, rgba(20,110,100,0) 100%), radial-gradient(70% 22% at 100% 22%, rgba(120,84,30,0.55) 0%, rgba(120,84,30,0) 100%), radial-gradient(80% 26% at 0% 52%, rgba(16,120,110,0.55) 0%, rgba(16,120,110,0) 100%), radial-gradient(80% 26% at 100% 74%, rgba(76,60,160,0.45) 0%, rgba(76,60,160,0) 100%), radial-gradient(100% 26% at 40% 100%, rgba(20,110,100,0.60) 0%, rgba(20,110,100,0) 100%), #0A0F1C',
      glass: 'border-radius: 30px; background: rgba(17,26,46,0.52); border: 1px solid rgba(255,255,255,0.09);',
      dim: 'rgba(3,6,14,0.5)',
      sheet: 'background: rgba(19,27,46,0.82); border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 -12px 40px rgba(0,0,0,0.5);',
      grabber: 'rgba(255,255,255,0.22)', inset: 'rgba(10,15,28,0.45)', line: 'rgba(255,255,255,0.08)',
      control: 'border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #E2E8F0;'
    };
    var tint = light
      ? { books: '#C2410C', drawify: '#6D28D9', music: '#BE185D' }
      : { books: '#FDBA74', drawify: '#C4B5FD', music: '#F9A8D4' };
    var list = [
      { id: 'books', name: 'Books', about: 'Reading list and notes', icon: 'M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z' },
      { id: 'drawify', name: 'Drawify', about: 'Trace an image onto paper', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
      { id: 'music', name: 'Music', about: '[DESCRIPTION]', icon: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z' }
    ];
    return {
      c: c,
      apps: list.map(function (a, i) {
        var color = tint[a.id];
        return Object.assign({}, a, {
          glyph: color,
          divider: i === 0 ? '0' : '1px solid ' + c.line,
          tile: light
            ? 'background: linear-gradient(180deg, #FFFFFF 0%, #F1F5F9 100%); border: 1px solid ' + color + '33; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 10px rgba(15,23,42,0.10);'
            : 'background: linear-gradient(180deg, #1D2A47 0%, #111A2E 100%); border: 1px solid ' + color + '45; box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 3px 10px rgba(0,0,0,0.45);'
        });
      })
    };
  }
}
</script>
</body>
</html>
