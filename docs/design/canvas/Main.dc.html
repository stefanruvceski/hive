    </a>

  <nav aria-label="Pinned apps" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 34px; border: 1px solid {{accentEdge}}; background: {{c.dock}}; backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); box-shadow: {{c.dockShadow}};">

    <span aria-hidden="true" style="width: 1px; height: 32px; background: {{c.divider}};"></span>
    <a href="Customize.dc.html" aria-label="Customize Home" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1px solid {{accentEdge}}; background: {{accentFill}}; color: {{c.accentText}}; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2DD4BF","options":["#2DD4BF","#34D399","#4ADE80"]},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"largeText":{"editor":"boolean","default":false},"groupTitles":{"editor":"boolean","default":true},"demoScrolled":{"editor":"boolean","default":false},"previewMoreGroups":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>

      text: '#0F172A', text2: '#334155', text3: '#475569', text4: '#64748B',
      wallpaper: 'radial-gradient(90% 26% at 0% 0%, rgba(45,212,191,0.32) 0%, rgba(45,212,191,0) 100%), radial-gradient(70% 22% at 100% 22%, rgba(251,191,36,0.24) 0%, rgba(251,191,36,0) 100%), radial-gradient(80% 26% at 0% 52%, rgba(45,212,191,0.22) 0%, rgba(45,212,191,0) 100%), radial-gradient(80% 26% at 100% 74%, rgba(139,92,246,0.16) 0%, rgba(139,92,246,0) 100%), radial-gradient(100% 26% at 40% 100%, rgba(45,212,191,0.24) 0%, rgba(45,212,191,0) 100%), #EEF2F5',
      glass: 'border-radius: 30px; background: rgba(255,255,255,0.62); border: 1px solid rgba(15,23,42,0.07); backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(15,23,42,0.08);',
      control: 'border: 1px solid rgba(15,23,42,0.10); background: rgba(255,255,255,0.70); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 18px rgba(15,23,42,0.10); color: #1E293B;',
      scrimTop: 'linear-gradient(180deg, rgba(238,242,245,0.78) 0%, rgba(238,242,245,0.6) 70%, rgba(238,242,245,0) 100%)',

      wallpaper: 'radial-gradient(90% 26% at 0% 0%, rgba(20,110,100,0.75) 0%, rgba(20,110,100,0) 100%), radial-gradient(70% 22% at 100% 22%, rgba(120,84,30,0.55) 0%, rgba(120,84,30,0) 100%), radial-gradient(80% 26% at 0% 52%, rgba(16,120,110,0.55) 0%, rgba(16,120,110,0) 100%), radial-gradient(80% 26% at 100% 74%, rgba(76,60,160,0.45) 0%, rgba(76,60,160,0) 100%), radial-gradient(100% 26% at 40% 100%, rgba(20,110,100,0.60) 0%, rgba(20,110,100,0) 100%), #0A0F1C',

      scrimTop: 'linear-gradient(180deg, rgba(10,15,28,0.70) 0%, rgba(10,15,28,0.55) 70%, rgba(10,15,28,0) 100%)',

      habits: { name: 'Habits', icon: 'M21 11.1V12a9 9 0 1 1-5.3-8.2M21 4L12 13l-3-3' },

      books: { name: 'Books', icon: 'M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z' },
      drawify: { name: 'Drawify', icon: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
      music: { name: 'Music', icon: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z' }
    };
    var tileOf = function (id) {

      return {
