<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hive home, largest text size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0F1C;">
  <dc-import name="Main" large-text="{{yes}}" preview-more-groups="{{yes}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
