# Expo "golden workflow": https://docs.expo.dev/eas/workflows/examples/deploy-to-production/
#
# Cost model (Free plan): fingerprint / get-build / update / submit jobs draw from the
# 60 free CI/CD minutes per month; build jobs draw from the 15 Android + 15 iOS free builds.
# Because of the fingerprint check, a native build only happens when native code changed —
# JS-only changes ship as an OTA update in ~2 minutes and cost no build.
name: Deploy to production

on:
  push:
    branches: ['main']

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  # A human confirms each store submission; builds still run unattended.
  # https://docs.expo.dev/eas/workflows/pre-packaged-jobs/
  approve_android_submit:
    name: Approve Android store submission
    needs: [build_android]
    type: require-approval

  approve_ios_submit:
    name: Approve iOS store submission
    needs: [build_ios]
    type: require-approval

  submit_android_build:
    name: Submit Android build
    needs: [build_android, approve_android_submit]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios_build:
    name: Submit iOS build
    needs: [build_ios, approve_ios_submit]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  publish_android_update:
    name: Publish Android update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: android

  publish_ios_update:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios
